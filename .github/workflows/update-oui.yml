name: Update oui.csv

# Refreshes oui.csv from the IEEE registry and opens a PR if changes exist.
# Opens a PR (never pushes to main directly) so updates are reviewable.
#
# Required permissions (set below): `contents: write` to push the branch and
# `pull-requests: write` to open the PR. No secrets are required — the default
# GITHUB_TOKEN is sufficient. The "Allow GitHub Actions to create and approve
# pull requests" setting must be enabled under Settings -> Actions -> General.

on:
  schedule:
    # Weekly, Mondays at 07:13 UTC. Off-the-hour to avoid registry-side load spikes.
    - cron: "13 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download and validate latest OUI registry
        run: python3 scripts/update_oui.py --output oui.csv

      - name: Run tests against refreshed data
        run: python3 -m unittest discover -s tests -v

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- oui.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in oui.csv."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            added=$(git diff --numstat -- oui.csv | awk '{print $1}')
            removed=$(git diff --numstat -- oui.csv | awk '{print $2}')
            echo "added=$added" >> "$GITHUB_OUTPUT"
            echo "removed=$removed" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): refresh oui.csv from IEEE registry"
          title: "chore(data): weekly oui.csv refresh"
          body: |
            Automated refresh of `oui.csv` from the IEEE OUI registry
            (`https://standards-oui.ieee.org/oui/oui.csv`).

            * Lines added: ${{ steps.diff.outputs.added }}
            * Lines removed: ${{ steps.diff.outputs.removed }}

            Validated by `scripts/update_oui.py` (header check, row-count
            floor, shrink guard) and tests in `tests/test_maclookup.py`.

            Triggered by: `${{ github.event_name }}` on `${{ github.ref_name }}`.
          branch: chore/update-oui
          delete-branch: true
          labels: |
            data
            automated
