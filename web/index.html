<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>MAC Vendor Lookup</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>MAC Vendor Lookup</h1>
    <p class="tagline">
      Offline lookup across IEEE
      <abbr title="OUI / 24-bit assignments">MA-L</abbr>,
      <abbr title="28-bit assignments">MA-M</abbr>, and
      <abbr title="OUI-36 / 36-bit assignments">MA-S</abbr> registries.
    </p>
  </header>

  <main>
    <section class="lookup" aria-labelledby="lookup-h">
      <h2 id="lookup-h" class="visually-hidden">Lookup</h2>
      <label for="query" class="lbl">MAC address, prefix, or vendor name</label>
      <input
        id="query"
        type="search"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="00:1A:7D…  or  cisco"
        aria-describedby="query-hint"
      />
      <p id="query-hint" class="hint">
        Hex input does a longest-prefix lookup (MA-S → MA-M → MA-L).
        Text input does fuzzy vendor search.
      </p>
    </section>

    <section id="results" aria-live="polite" aria-atomic="false"></section>
  </main>

  <footer>
    <div class="status" role="status">
      <span id="status-text">Loading registry…</span>
      <button id="refresh" type="button" disabled
              title="Fetch the latest IEEE registries (online only)">
        Refresh data
      </button>
    </div>
    <p class="version">
      Data version: <span id="data-version">—</span> ·
      <a href="https://github.com/StewAlexander-com/maclookup.py">source</a>
    </p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
